services:
  delivery-pipeline:
    build:
      context: .
    image: delivery-pipeline:local
    container_name: delivery-pipeline
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:5173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploy}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-before-deploy}
      AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED:-true}
      MONGODB_URI: ${MONGODB_URI:-mongodb://delivery:delivery@mongodb:27017/delivery_pipeline?authSource=admin}
      MONGODB_DB: ${MONGODB_DB:-delivery_pipeline}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:5173}
      SATISFACTION_AUTO_GOOD_DAYS: ${SATISFACTION_AUTO_GOOD_DAYS:-7}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_REDIRECT_URI: ${LARK_REDIRECT_URI:-}
      LARK_BASE_TOKEN: ${LARK_BASE_TOKEN:-}
      LARK_WIKI_NODE_TOKEN: ${LARK_WIKI_NODE_TOKEN:-}
      LARK_BASE_WEB_URL: ${LARK_BASE_WEB_URL:-}
      LARK_LEDGER_TABLE_ID: ${LARK_LEDGER_TABLE_ID:-tbl7FrAYMpseNuPA}
      LARK_REQUEST_TABLE_ID: ${LARK_REQUEST_TABLE_ID:-tblrdV8pbi1Ny9mJ}
      LARK_LEDGER_VIEW_ID: ${LARK_LEDGER_VIEW_ID:-}
      LARK_REQUEST_VIEW_ID: ${LARK_REQUEST_VIEW_ID:-}
      LARK_DATA_TEAM_TABLE_ID: ${LARK_DATA_TEAM_TABLE_ID:-}
      LARK_DATA_TEAM_VIEW_ID: ${LARK_DATA_TEAM_VIEW_ID:-}
      LARK_LEDGER_URL: ${LARK_LEDGER_URL:-}
      LARK_REQUEST_URL: ${LARK_REQUEST_URL:-}
      LARK_DATA_TEAM_URL: ${LARK_DATA_TEAM_URL:-}
      LARK_SYNC_INTERVAL_MS: ${LARK_SYNC_INTERVAL_MS:-300000}
      LARK_WEBHOOK_URL: ${LARK_WEBHOOK_URL:-}
      LARK_SUPER_ADMIN_OPEN_IDS: ${LARK_SUPER_ADMIN_OPEN_IDS:-}
      LARK_SUPER_ADMIN_EMAILS: ${LARK_SUPER_ADMIN_EMAILS:-}
      LARK_DELIVERY_ADMIN_OPEN_IDS: ${LARK_DELIVERY_ADMIN_OPEN_IDS:-}
      LARK_DELIVERY_ADMIN_EMAILS: ${LARK_DELIVERY_ADMIN_EMAILS:-}
    volumes:
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: delivery-pipeline-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: delivery
      MONGO_INITDB_ROOT_PASSWORD: delivery
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: delivery-pipeline-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mongodb-data:
  redis-data:
