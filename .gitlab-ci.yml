stages:
  - test
  - build
  - confirm
  - deploy

variables:
  CI_REGISTRY: docker.shlab.tech
  CI_REGISTRY_USER: cicd@1397355716557288
  # 凭据由 GitLab → Settings → CI/CD → Variables 注入，不要写回本文件：
  # 本仓库有公开的 GitHub 镜像，写在这里等于公开发布。
  #
  # 名字刻意不叫 CI_REGISTRY_PASSWORD —— 那是 GitLab 的预定义变量（GitLab 自带镜像仓库用它），
  # 官方明确不建议用 CI_ 前缀命名自定义变量，同名的项目级变量可能被预定义值盖掉。
  # 之前这个值写在本文件的 variables: 块里（文件级优先级最高）所以一直正常，
  # 搬到项目 Variables 后就可能被 GitLab 的值顶掉，kaniko 会拿错误的凭据去登
  # docker.shlab.tech 并得到 401。用一个自有前缀的名字彻底绕开这个歧义。

before_script:
  - export IMAGE_REPOSITORY=${CI_PROJECT_PATH}
  - export IMAGE_TAG=${CI_COMMIT_BRANCH}.${CI_PIPELINE_IID:-c.${CI_COMMIT_SHA:0:8}}
  - export IMAGE_NAME=${CI_REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}

test:
  stage: test
  image:
    name: docker.shlab.tech/public/node:22-alpine
    entrypoint: [""]
  script:
    - npm ci --registry=https://npm.shlab.tech
    - npm run check

build:
  stage: build
  rules:
    - if: "$CI_COMMIT_REF_NAME =~ /^(main|dev)$/"
  image:
    name: docker.shlab.tech/public/kaniko-executor:debug
    entrypoint: [""]
  cache:
    paths:
      - /cache
  retry: 2
  script:
    - echo "building ${IMAGE_NAME}"
    # 明确失败，而不是让 kaniko 拿着空密码去推镜像然后报一个看不出原因的 401
    - if [ -z "${SHLAB_REGISTRY_PASSWORD}" ]; then echo "SHLAB_REGISTRY_PASSWORD 未注入：请在 Settings → CI/CD → Variables 添加，且确认它对当前分支可见"; exit 1; fi
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${SHLAB_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}"
      --cache=false
      --force

confirm_production_deployment:
  stage: confirm
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      when: manual
  script:
    - echo "确认部署到生产环境"

deploy:
  stage: deploy
  image: node:20-alpine
  needs:
    - job: build
    - job: confirm_production_deployment
      optional: true
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      when: on_success
    - if: "$CI_COMMIT_REF_NAME == 'dev'"
      when: on_success
  script:
    - echo $IMAGE_NAME
    - export GIT_TAG="${CI_PROJECT_NAME}@v${IMAGE_TAG}"
    - if [ "$CI_COMMIT_REF_NAME" = "main" ]; then export APP_ENV=prod; else export APP_ENV=dev; fi
    - npm_config_registry="https://npm.shlab.tech" npx gitops-deploy -c ./deployrc.${APP_ENV}.json
